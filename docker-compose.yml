version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cat-osis-hijaumuda:latest
    container_name: cat_osis_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    networks:
      - cat-osis-network

networks:
  cat-osis-network:
    driver: bridge